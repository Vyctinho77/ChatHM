# Para o Docker Manager da Hostinger (VPS): o banco é o Supabase e o HTTPS é automático (Caddy).
# As variáveis vêm do campo "environment" do projeto (DOMAIN, DATABASE_URL, ENCRYPTION_KEY, SETUP_TOKEN).
# O Docker Manager NÃO faz build a partir de URL do GitHub: a imagem chathm:latest é construída antes,
# pelo projeto auxiliar deploy/hostinger-build.yml. Para atualizar: rode o build e depois recrie este projeto.
name: chathm

services:
  app:
    image: chathm:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
      ALLOWED_ORIGINS: https://${DOMAIN:?defina DOMAIN}
      COOKIE_SECURE: "true"
      REQUIRE_ADMIN_MFA: "true"
      TRUST_PROXY_HEADERS: "true"
      WHATSAPP_PROVIDER: whatsmeow
      SETUP_TOKEN: ${SETUP_TOKEN:?defina SETUP_TOKEN}
      LOG_LEVEL: info
    volumes: [attachments:/data]
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8080
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]

volumes:
  attachments:
  caddy_data:
  caddy_config:
