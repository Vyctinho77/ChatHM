# Igual ao docker-compose.yml, mas com o banco no Supabase (sem container de Postgres).
#   docker compose -f deploy/docker-compose.supabase.yml --env-file deploy/.env up -d --build
# DATABASE_URL: use a "Session pooler" do Supabase (IPv4, porta 5432, usuário postgres.<ref>) com ?sslmode=require.
name: chathm

services:
  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (Supabase, Session pooler)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
      ALLOWED_ORIGINS: https://${DOMAIN:?defina DOMAIN}
      COOKIE_SECURE: "true"
      REQUIRE_ADMIN_MFA: "true"
      TRUST_PROXY_HEADERS: "true"
      WHATSAPP_PROVIDER: whatsmeow
      SETUP_TOKEN: ${SETUP_TOKEN:?defina SETUP_TOKEN}
      LOG_LEVEL: info
    volumes: [attachments:/data]
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  attachments:
  caddy_data:
  caddy_config:
