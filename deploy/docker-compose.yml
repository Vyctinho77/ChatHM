# Produção em um servidor (VPS) com HTTPS automático (Caddy). Veja docs/deploy.md.
#   cp deploy/.env.example deploy/.env   # preencha DOMAIN, senhas e chaves
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: chathm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chathm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: chathm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chathm -d chathm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://chathm:${POSTGRES_PASSWORD}@db:5432/chathm?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
      ALLOWED_ORIGINS: https://${DOMAIN:?defina DOMAIN}
      COOKIE_SECURE: "true"
      REQUIRE_ADMIN_MFA: "true"
      TRUST_PROXY_HEADERS: "true" # atrás do Caddy (IP real para limites de tentativa)
      WHATSAPP_PROVIDER: whatsmeow
      SETUP_TOKEN: ${SETUP_TOKEN:?defina SETUP_TOKEN}
      LOG_LEVEL: info
    volumes: [attachments:/data]
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  attachments:
  caddy_data:
  caddy_config:
