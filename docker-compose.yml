# Ambiente de desenvolvimento. Produção usa HTTPS (proxy reverso) e backups — ver docs/.
name: chathm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chathm
      POSTGRES_PASSWORD: chathm
      POSTGRES_DB: chathm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chathm -d chathm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Armazenamento S3 compatível para anexos (bucket privado).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chathm
      MINIO_ROOT_PASSWORD: chathm-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 chathm chathm-dev-secret &&
      mc mb --ignore-existing local/chathm-attachments &&
      mc anonymous set none local/chathm-attachments
      "

  api:
    build: { context: ./backend }
    profiles: ["full"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://chathm:chathm@postgres:5432/chathm?sslmode=disable
      S3_ENDPOINT: minio:9000
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
