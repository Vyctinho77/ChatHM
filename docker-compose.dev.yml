name: chathm-dev
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: chathm
      POSTGRES_PASSWORD: chathm
      POSTGRES_DB: chathm_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chathm -d chathm_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev_pgdata:
